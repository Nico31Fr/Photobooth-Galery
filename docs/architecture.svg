<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Photobooth gallery system architecture</title>
  <desc id="desc">A photobooth Raspberry Pi is connected to a gallery Raspberry Pi by a direct Ethernet cable. The gallery Pi provides a captive Wi-Fi portal to phones.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="booth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gallery" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto">
      <path d="M0,0 L18,9 L0,18 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto">
      <path d="M0,0 L18,9 L0,18 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#background)"/>
  <text x="600" y="56" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Photobooth Gallery System</text>
  <text x="600" y="86" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#64748b">Direct Ethernet link · captive Wi-Fi portal · automatic photo synchronization</text>

  <!-- Photobooth card -->
  <g filter="url(#shadow)">
    <rect x="50" y="130" width="300" height="340" rx="22" fill="#ffffff"/>
  </g>
  <rect x="50" y="130" width="300" height="84" rx="22" fill="url(#booth)"/>
  <rect x="50" y="190" width="300" height="24" fill="url(#booth)"/>
  <rect x="75" y="156" width="46" height="32" rx="6" fill="none" stroke="#ffffff" stroke-width="4"/>
  <path d="M85 156 l7-8 h16 l7 8" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="98" cy="172" r="8" fill="none" stroke="#ffffff" stroke-width="4"/>
  <text x="134" y="180" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Photobooth Pi</text>
  <text x="75" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Capture &amp; sync</text>
  <circle cx="80" cy="280" r="5" fill="#2563eb"/>
  <text x="95" y="286" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">pibooth captures photos</text>
  <circle cx="80" cy="312" r="5" fill="#2563eb"/>
  <text x="95" y="318" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">photo-sync service</text>
  <circle cx="80" cy="344" r="5" fill="#2563eb"/>
  <text x="95" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">final images only</text>
  <rect x="70" y="380" width="260" height="32" rx="8" fill="#eff6ff"/>
  <text x="200" y="401" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="600" fill="#1d4ed8">eth0 · 192.168.50.2/24</text>

  <!-- Gallery card -->
  <g filter="url(#shadow)">
    <rect x="530" y="130" width="300" height="340" rx="22" fill="#ffffff"/>
  </g>
  <rect x="530" y="130" width="300" height="84" rx="22" fill="url(#gallery)"/>
  <rect x="530" y="190" width="300" height="24" fill="url(#gallery)"/>
  <rect x="555" y="153" width="46" height="36" rx="5" fill="none" stroke="#ffffff" stroke-width="4"/>
  <line x1="564" y1="166" x2="590" y2="166" stroke="#ffffff" stroke-width="3"/>
  <line x1="564" y1="177" x2="590" y2="177" stroke="#ffffff" stroke-width="3"/>
  <circle cx="594" cy="166" r="2.5" fill="#ffffff"/>
  <circle cx="594" cy="177" r="2.5" fill="#ffffff"/>
  <text x="614" y="180" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Gallery Pi</text>
  <text x="555" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Storage &amp; web gallery</text>
  <circle cx="560" cy="280" r="5" fill="#7c3aed"/>
  <text x="575" y="286" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">stores incoming photos</text>
  <circle cx="560" cy="312" r="5" fill="#7c3aed"/>
  <text x="575" y="318" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">creates thumbnails</text>
  <circle cx="560" cy="344" r="5" fill="#7c3aed"/>
  <text x="575" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#334155">FastAPI + nginx + portal</text>
  <rect x="550" y="380" width="260" height="32" rx="8" fill="#f5f3ff"/>
  <text x="680" y="401" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="600" fill="#6d28d9">eth0 · 192.168.50.1/24</text>

  <!-- Direct Ethernet cable -->
  <line x1="352" y1="300" x2="520" y2="300" stroke="#ea580c" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <rect x="362" y="222" width="156" height="62" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="440" y="247" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" fill="#c2410c">ETHERNET</text>
  <text x="440" y="270" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#9a3412">direct cable</text>
  <text x="440" y="330" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#9a3412">rsync / SSH</text>

  <!-- Captive Wi-Fi link -->
  <line x1="834" y1="300" x2="948" y2="300" stroke="#7c3aed" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
  <rect x="838" y="222" width="114" height="62" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="895" y="247" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#6d28d9">CAPTIVE</text>
  <text x="895" y="270" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#7c3aed">Wi-Fi portal</text>
  <text x="895" y="330" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#6d28d9">SSID: Photobooth</text>

  <!-- Phones card -->
  <g filter="url(#shadow)">
    <rect x="960" y="130" width="190" height="340" rx="22" fill="#ffffff"/>
  </g>
  <text x="1055" y="174" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Guests</text>
  <text x="1055" y="198" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">captive Wi-Fi clients</text>
  <rect x="988" y="240" width="55" height="100" rx="9" fill="#0f172a"/>
  <rect x="994" y="250" width="43" height="70" rx="3" fill="#ede9fe"/>
  <circle cx="1015" cy="330" r="4" fill="#cbd5e1"/>
  <circle cx="1015" cy="272" r="9" fill="#a78bfa"/>
  <path d="M1001 307 q14-20 28 0" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <rect x="1065" y="240" width="55" height="100" rx="9" fill="#0f172a"/>
  <rect x="1071" y="250" width="43" height="70" rx="3" fill="#dbeafe"/>
  <circle cx="1093" cy="330" r="4" fill="#cbd5e1"/>
  <circle cx="1093" cy="272" r="9" fill="#60a5fa"/>
  <path d="M1078 307 q15-20 29 0" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text x="1055" y="372" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#475569">http://192.168.4.1</text>
  <rect x="970" y="388" width="170" height="30" rx="8" fill="#f5f3ff"/>
  <text x="1055" y="408" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600" fill="#6d28d9">wlan0 · 192.168.4.1/24</text>

  <text x="600" y="540" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#64748b">No Internet connection is required for normal operation</text>
</svg>
